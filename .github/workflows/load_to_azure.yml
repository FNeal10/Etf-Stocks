
name: Load data to Azure SQL Database

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      AZURE_CONNECTION_STRING:
        required: true
      CONTAINER_NAME:
        required: true
      SILVER_LOCATION:
        required: true
      DB_AZURE_SERVER:
        required: true
      DB_AZURE_DATABASE:
        required: true
      DB_AZURE_USERNAME:
        required: true
      DB_AZURE_PASSWORD:
        required: true
      DB_AZURE_STAGING_TABLE_NAME:
        required: true

jobs:
  load-to-db:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Microsoft ODBC Driver 18
        run: |
          set -e

          curl -fsSL -O https://packages.microsoft.com/config/ubuntu/24.04/packages-microsoft-prod.deb

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            -o Dpkg::Options::="--force-confnew" \
            ./packages-microsoft-prod.deb

          rm packages-microsoft-prod.deb

          sudo apt-get update

          sudo ACCEPT_EULA=Y apt-get install -y \
            msodbcsql18 \
            unixodbc-dev

          odbcinst -q -d

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Load Silver data and upsert into Azure SQL
        env:
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          SILVER_LOCATION: ${{ secrets.SILVER_LOCATION }}
          DB_AZURE_SERVER: ${{ secrets.DB_AZURE_SERVER }}
          DB_AZURE_DATABASE: ${{ secrets.DB_AZURE_DATABASE }}
          DB_AZURE_USERNAME: ${{ secrets.DB_AZURE_USERNAME }}
          DB_AZURE_PASSWORD: ${{ secrets.DB_AZURE_PASSWORD }}
          DB_AZURE_STAGING_TABLE_NAME: ${{ secrets.DB_AZURE_STAGING_TABLE_NAME }}
          PYTHONPATH: .
        run: python scripts/run_upsert.py
