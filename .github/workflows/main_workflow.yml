
name: Main Workflow

on:
  workflow_dispatch:
  schedule:
    # 7 AM Toronto time during EST
    - cron: '0 12 * 11,12,1,2,3 1-5'
    # 7 AM Toronto time during EDT
    - cron: '0 11 * 4,5,6,7,8,9,10 1-5'

jobs:
  scrape-and-transform:
    uses: ./.github/workflows/scrape_and_transform.yml
    secrets:
      AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
      BRONZE_LOCATION: ${{ secrets.BRONZE_LOCATION }}
      SILVER_LOCATION: ${{ secrets.SILVER_LOCATION }}

  load-to-db:
    needs: scrape-and-transform
    uses: ./.github/workflows/load_to_azure.yml
    secrets:
      AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
      CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
      SILVER_LOCATION: ${{ secrets.SILVER_LOCATION }}
      DB_AZURE_SERVER: ${{ secrets.DB_AZURE_SERVER }}
      DB_AZURE_DATABASE: ${{ secrets.DB_AZURE_DATABASE }}
      DB_AZURE_USERNAME: ${{ secrets.DB_AZURE_USERNAME }}
      DB_AZURE_PASSWORD: ${{ secrets.DB_AZURE_PASSWORD }}
      DB_AZURE_STAGING_TABLE_NAME: ${{ secrets.DB_AZURE_STAGING_TABLE_NAME }}
