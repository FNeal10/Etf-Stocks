
name: Scrape and Transform Market Data

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      AZURE_CONNECTION_STRING:
        required: true
      CONTAINER_NAME:
        required: true
      BRONZE_LOCATION:
        required: true
      SILVER_LOCATION:
        required: true

jobs:
  run-scraper:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scrape latest stock prices
        env:
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          BRONZE_LOCATION: ${{ secrets.BRONZE_LOCATION }}
          SILVER_LOCATION: ${{ secrets.SILVER_LOCATION }}
          PYTHONPATH: .
        run: python scripts/run_scraper.py

      - name: Transform Bronze to Silver
        env:
          AZURE_CONNECTION_STRING: ${{ secrets.AZURE_CONNECTION_STRING }}
          CONTAINER_NAME: ${{ secrets.CONTAINER_NAME }}
          BRONZE_LOCATION: ${{ secrets.BRONZE_LOCATION }}
          SILVER_LOCATION: ${{ secrets.SILVER_LOCATION }}
          PYTHONPATH: .
        run: python scripts/run_silver.py
